[project]
name = "ashfield-calendar-backend"
version = "0.1.0"
description = "ashfield-calendar 백엔드 (FastAPI + SQLAlchemy)"
requires-python = ">=3.14"   # uuid.uuid7() 사용 (3.14 에 추가)
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "redis>=5.2",
    "httpx>=0.27",
    "python-multipart>=0.0.20",
    # ashfield-calendar 추가
    "python-dateutil>=2.9",    # RRULE expand (ADR-0007)
    "icalendar>=6.0",          # 외부 .ics 피드 파싱 (Phase 2)
    "recurring-ical-events>=3.5",  # VEVENT EXDATE/RDATE/RECURRENCE-ID 정확 확장
    "arq>=0.26",               # Redis-backed job queue (cron + 백그라운드 잡)
    "cryptography>=43",        # Fernet 대칭 암호화 (SMTP 비밀번호 등)
    "bcrypt>=4.2",             # CalDAV App Token 해싱 (ADR-0014, PHP password_verify 와 호환)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# autogenerate 생성물 — 손대지 않음 (alembic 파일 수정 금지 규칙)
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = [
    "E501",  # line-length은 위에서
    "B008",  # FastAPI의 Depends(...)를 인자 default로 쓰는 건 표준 패턴
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
