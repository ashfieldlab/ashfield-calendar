# 운영 배포: 단일 호스트 docker compose (docs/deploy.md).
#
# 서버에서 scripts/prod.sh 가 이 파일로 빌드, 마이그레이션, 기동을 한다 (로컬: make deploy).
#   docker compose -f docker-compose.prod.yml --env-file .env.prod ...
# 밖으로 여는 포트는 frontend 와 caldav-nginx 둘: 앞단 리버스 프록시(다른 기계)가 LAN 으로 받아 TLS 를 끝낸다.
# backend 는 frontend(BFF)만 내부 네트워크로 부르므로 포트를 열지 않는다.

name: ${COMPOSE_PROJECT_NAME:-ashfield-calendar-prod}

x-restart-policy: &restart_policy
  restart: unless-stopped

# backend, worker 가 같이 쓰는 값 (worker 도 ENVIRONMENT=production 이라 AUTH_* 가 없으면 부팅 거부).
x-backend-env: &backend_env
  ENVIRONMENT: production
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  # 이메일, 구독(ICS), CalDAV 링크의 기준 주소 = 이 앱의 공개 주소
  CALENDAR_BASE_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL 필요}
  # 인증: Ashfield 계정 서버 액세스 토큰 검증 (ADR-0024). iss = ACCOUNT_URL, aud 에 이 앱 공개 주소.
  AUTH_JWKS_URL: ${ACCOUNT_URL:?ACCOUNT_URL 필요}/api/auth/jwks
  AUTH_ISSUER: ${ACCOUNT_URL}
  AUTH_AUDIENCE: ${BETTER_AUTH_URL}
  SYSTEM_ADMIN_EMAILS: ${SYSTEM_ADMIN_EMAILS:-}
  SMTP_ENABLED: ${SMTP_ENABLED:-false}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Ashfield}
  SMTP_ENCRYPTION_KEY: ${SMTP_ENCRYPTION_KEY:-}
  HOLIDAYS_ICS_URL: ${HOLIDAYS_ICS_URL:-}
  PUBLIC_RATE_LIMIT_PER_IP: ${PUBLIC_RATE_LIMIT_PER_IP:-1000}
  PUBLIC_RATE_LIMIT_PER_EMAIL: ${PUBLIC_RATE_LIMIT_PER_EMAIL:-1}
  BOOKING_PII_RETENTION_DAYS: ${BOOKING_PII_RETENTION_DAYS:-30}
  LOG_CATEGORIES: ${LOG_CATEGORIES:-}

# frontend, auth-migrate 가 같이 쓰는 값 (Better Auth = 계정 서버 OIDC 클라이언트, ADR-0024)
x-frontend-env: &frontend_env
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET 필요}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  ACCOUNT_URL: ${ACCOUNT_URL}
  ASHFIELD_CLIENT_ID: ${ASHFIELD_CLIENT_ID:-ashfield-calendar}
  ASHFIELD_CLIENT_SECRET: ${ASHFIELD_CLIENT_SECRET:?ASHFIELD_CLIENT_SECRET 필요}
  BACKEND_INTERNAL_URL: http://backend:8000

services:
  # ───── 인프라 ─────
  postgres:
    image: postgres:16-alpine
    <<: *restart_policy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    <<: *restart_policy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ───── 앱 ─────
  backend:
    build:
      context: ./backend
    <<: *restart_policy
    environment: *backend_env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # arq worker: 같은 backend 이미지, CMD 만 다름.
  worker:
    build:
      context: ./backend
    <<: *restart_policy
    command: ["python", "-m", "arq", "app.jobs.worker.WorkerSettings"]
    environment: *backend_env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # 이미지 HEALTHCHECK 는 uvicorn :8000 용이라 worker 엔 맞지 않는다. arq 가 죽으면 컨테이너가 끝나고 재시작된다.
    # slim 이미지에 pgrep 이 없어 /proc 에서 arq 프로세스를 찾는다 (up --wait 가 헬스체크를 요구).
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if any(b'arq' in open('/proc/'+p+'/cmdline','rb').read() for p in os.listdir('/proc') if p.isdigit()) else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        # 헤더의 파일 앱 링크 (빌드 때 굳는다). 비우면 숨김.
        NEXT_PUBLIC_DRIVE_URL: ${NEXT_PUBLIC_DRIVE_URL:-}
    <<: *restart_policy
    environment: *frontend_env
    ports:
      - "${FRONTEND_HOST_PORT:-3100}:3000"
    depends_on:
      backend: { condition: service_healthy }

  # Better Auth 테이블 생성과 갱신 (스키마 auth): 일회성 (scripts/prod.sh up 이 매 배포 실행).
  # 런타임 이미지엔 CLI 가 없어 builder 단계 이미지(전체 node_modules + 소스)로 실행.
  auth-migrate:
    build:
      context: ./frontend
      target: builder
      args:
        NEXT_PUBLIC_DRIVE_URL: ${NEXT_PUBLIC_DRIVE_URL:-}
    profiles: ["tools"]
    command: ["node_modules/.bin/auth", "migrate", "--config", "lib/auth/server.ts", "--yes"]
    environment: *frontend_env
    depends_on:
      postgres: { condition: service_healthy }

  # ───── CalDAV (Sabre/DAV PHP): ADR-0014. 같은 Postgres 공유.
  # 앞단 프록시가 ${BETTER_AUTH_URL}/caldav/ 와 /.well-known/caldav 를 caldav-nginx 로 넘긴다.
  caldav-php:
    build:
      context: ./caldav
    <<: *restart_policy
    environment:
      CALDAV_DB_DSN: "pgsql:host=postgres;port=5432;dbname=${POSTGRES_DB};user=${POSTGRES_USER};password=${POSTGRES_PASSWORD}"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f php-fpm || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  caldav-nginx:
    build:
      context: ./caldav/nginx
    <<: *restart_policy
    ports:
      - "${CALDAV_HOST_PORT:-3101}:80"
    depends_on:
      - caldav-php
    healthcheck:
      # 인증 없는 요청은 401 이 정상: nginx 와 php-fpm 이 응답하는지만 본다.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/caldav/ 2>&1 | grep -q '401' || wget -q -O /dev/null http://127.0.0.1/caldav/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  pgdata:
