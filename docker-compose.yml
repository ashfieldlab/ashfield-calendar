# Hybrid 워크플로우 (SPEC §4.1):
#   - 인프라(redis, postgres, mailpit)만 docker로 띄움
#   - 앱(frontend, backend)은 호스트에서 실행 (hot-reload + 디버거 친화)
#
# 포트 충돌 회피:
#   - 호스트 포트는 모두 .env 환경변수로 오버라이드 가능
#   - 프로젝트 namespace는 COMPOSE_PROJECT_NAME으로 분리
#
# 시작: make infra
# 정지: make stop

name: ${COMPOSE_PROJECT_NAME:-ashfield-calendar}

services:
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-ashfield-calendar}-redis
    ports:
      - "${REDIS_HOST_PORT:-6479}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-ashfield-calendar}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ashfield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ashfield_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ashfield_calendar}
    ports:
      - "${POSTGRES_HOST_PORT:-5532}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ashfield} -d ${POSTGRES_DB:-ashfield_calendar}"]
      interval: 10s
      timeout: 3s
      retries: 5

  # SMTP catcher — dev 전용. 실제 메일 발송 없이 web UI 로 확인.
  #   SMTP:  localhost:${MAILPIT_SMTP_HOST_PORT:-11025}
  #   Web:   http://localhost:${MAILPIT_WEB_HOST_PORT:-18025}
  mailpit:
    image: axllent/mailpit:latest
    container_name: ${COMPOSE_PROJECT_NAME:-ashfield-calendar}-mailpit
    ports:
      - "${MAILPIT_SMTP_HOST_PORT:-11025}:1025"
      - "${MAILPIT_WEB_HOST_PORT:-18025}:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # CalDAV server (ADR-0014) — Sabre/DAV (PHP). 우리 backend 와 같은 DB 공유.
  #   외부 캘린더 앱 endpoint: http://localhost:${CALDAV_HOST_PORT:-18080}/caldav/
  #   PROD 에선 같은 nginx 가 /caldav/* → caldav-nginx 로 라우팅
  caldav-php:
    build:
      context: ./caldav
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-ashfield-calendar}-caldav-php
    environment:
      CALDAV_DB_DSN: "pgsql:host=postgres;port=5432;dbname=${POSTGRES_DB:-ashfield_calendar};user=${POSTGRES_USER:-ashfield};password=${POSTGRES_PASSWORD:-ashfield_dev}"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "9000"

  caldav-nginx:
    image: nginx:alpine
    container_name: ${COMPOSE_PROJECT_NAME:-ashfield-calendar}-caldav-nginx
    ports:
      - "${CALDAV_HOST_PORT:-18080}:80"
    volumes:
      - ./caldav/nginx/caldav.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - caldav-php

  # 백그라운드 잡 워커 (arq) — cron 잡 실행 → JobRun 원장(모니터링 페이지 데이터원).
  # backend 는 호스트 실행이지만 워커는 상주 프로세스라 컨테이너로(caldav-php 와 동일 패턴).
  # 라이브 잡 코드 마운트(app 만) → 이미지 재빌드 없이 워커 재시작만으로 반영.
  # 설정은 호스트 .env 상속 + 컨테이너 내부 주소(postgres/redis/mailpit)만 override.
  worker:
    build:
      context: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-ashfield-calendar}-worker
    command: ["python", "-m", "arq", "app.jobs.worker.WorkerSettings"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ashfield}:${POSTGRES_PASSWORD:-ashfield_dev}@postgres:5432/${POSTGRES_DB:-ashfield_calendar}
      REDIS_URL: redis://redis:6379
      SMTP_ENABLED: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USE_TLS: "false"
    volumes:
      - ./backend/app:/app/app:ro
    # 이미지 HEALTHCHECK 는 uvicorn :8000/health 용 — arq 워커엔 그 포트가 없어
    # 항상 unhealthy 로 오인됨. dev 에선 비활성화(잡 자체 관측은 JobRun 원장이 담당).
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
