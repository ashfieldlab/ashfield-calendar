# nginx 가 외부 요청을 받아 PHP-FPM 으로 전달 (CalDAV 표준 verb 모두 통과).
# 운영에선 같은 nginx 가 /caldav/* 만 여기 location 블록으로 라우팅.

server {
    listen 80;
    server_name _;

    root /app/public;
    index server.php;

    # CalDAV well-known auto-discovery (RFC 6764)
    location = /.well-known/caldav {
        return 301 /caldav/;
    }
    location = /.well-known/carddav {
        return 301 /caldav/;
    }

    # 모든 요청을 server.php 로
    location / {
        try_files $uri /server.php?$query_string;
    }

    location ~ ^/server\.php(/|$) {
        # Docker 내부 DNS (127.0.0.11): caldav-php 재시작으로 IP 가 바뀌어도 매 요청 resolve.
        # variable 로 upstream 지정해야 fastcgi_pass 가 nginx 부팅 시점에 한 번만 잡지 않음.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $caldav_upstream caldav-php:9000;
        fastcgi_pass $caldav_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        # CalDAV / WebDAV verbs (PROPFIND, REPORT 등) 도 통과해야 함
        fastcgi_param SCRIPT_FILENAME $document_root/server.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_METHOD $request_method;
        # HTTP Basic 인증 헤더: nginx → PHP-FPM 기본 전달 안 함 (잘 알려진 함정).
        # 이게 없으면 Sabre Auth Plugin 이 빈 헤더로 익명 호출처럼 처리해 404.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;

        # 큰 ICS payload 대비
        fastcgi_read_timeout 60s;
        client_max_body_size 10M;
    }
}
